# Development overrides — hot-reload + exposed ports for local tooling
services:
  api:
    build:
      target: builder
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      ENVIRONMENT: development
      TEST_DATABASE_URL: postgresql+asyncpg://habit_user:habit_pass@postgres:5432/habit_power_test

  postgres:
    ports:
      - "5432:5432"   # expose for DBeaver / pgAdmin
    environment:
      POSTGRES_MULTIPLE_DATABASES: habit_power,habit_power_test
    volumes:
      - ./docker/create-multiple-postgres-databases.sh:/docker-entrypoint-initdb.d/create-dbs.sh

  redis:
    ports:
      - "6379:6379"
